name: Deploy to FTP on master push

on:
  push:
    branches:
      - master

jobs:
  unit-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer:v2
          extensions: mbstring, curl, dom, xml, xmlwriter, xmlreader

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Run unit tests
        run: vendor/bin/phpunit --configuration phpunit.xml

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: web/email-worker/package-lock.json

      - name: Install email worker dependencies
        working-directory: web/email-worker
        run: npm ci

      - name: Run email worker tests
        working-directory: web/email-worker
        env:
          CLIO_USE_MOCK_AUTH: '1'
        run: npm test

  deploy:
    runs-on: ubuntu-latest
    needs: unit-tests

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install lftp
        run: |
          sudo apt-get update
          sudo apt-get install -y lftp

      - name: Debug env
        run: |
          echo "Host: $FTP_HOST"
          echo "User: $FTP_USERNAME"
          # echo "Pass: $FTP_PASSWORD"  # liever niet loggen 😉
          echo "Remote dir: $FTP_REMOTE_DIR"
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_REMOTE_DIR: ${{ secrets.FTP_REMOTE_DIR }}

      - name: Write version file
        run: echo "${{ github.sha }}" > ./web/version

      # Cache-JSON, het e-mailarchief en de root-.htaccess blijven op de server.
      # lftp: het laatste passende patroon wint. Includes staan daarom
      # ná de excludes, anders uploadt data/.htaccess of cache/.htaccess niet.
      # --delete laat uitgesloten bestanden staan. Gebruik daar geen extra delete-vlag voor.
      - name: Deploy web/ to FTP (with delete & excludes)
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_REMOTE_DIR: ${{ secrets.FTP_REMOTE_DIR }}
        run: |
          lftp -u "$FTP_USERNAME","$FTP_PASSWORD" "$FTP_HOST" << EOF
          set cmd:fail-exit true
          set net:max-retries 1
          set net:timeout 20
          set ftp:ssl-allow false
          set ftp:passive-mode yes

          cd "$FTP_REMOTE_DIR"

          mirror -R --delete \
            --exclude-glob .htaccess \
            --exclude-glob cache/** \
            --exclude-glob cache/odata/** \
            --exclude-glob cache/odata/*/ \
            --exclude-glob cache/summaries/** \
            --exclude-glob data/** \
            --exclude-glob data/* \
            --exclude-glob data/emails/** \
            --exclude-glob data/php_errors/** \
            --exclude-glob data/user_prefs/** \
            --exclude-glob email-worker/config.json \
            --exclude-glob email-worker/node_modules/** \
            --exclude-glob analytics/*.sqlite \
            --exclude-glob analytics/*.sqlite-* \
            --exclude-glob auth.php \
            --include-glob cache/ \
            --include-glob cache/odata/ \
            --include-glob cache/summaries/ \
            --include-glob cache/.htaccess \
            --include-glob cache/index.html \
            --include-glob cache/index.php \
            --include-glob cache/odata/.htaccess \
            --include-glob cache/odata/index.html \
            --include-glob cache/odata/index.php \
            --include-glob cache/summaries/.htaccess \
            --include-glob cache/summaries/index.html \
            --include-glob cache/summaries/index.php \
            --include-glob data/ \
            --include-glob data/emails/ \
            --include-glob data/php_errors/ \
            --include-glob data/user_prefs/ \
            --include-glob data/.htaccess \
            --include-glob data/index.html \
            --include-glob data/index.php \
            --include-glob data/emails/.htaccess \
            --include-glob data/emails/index.html \
            --include-glob data/emails/index.php \
            --include-glob data/php_errors/.htaccess \
            --include-glob data/php_errors/index.html \
            --include-glob data/php_errors/index.php \
            --include-glob data/user_prefs/.htaccess \
            --include-glob data/user_prefs/index.html \
            --include-glob data/user_prefs/index.php \
            ./web .

          set cmd:fail-exit false
          chmod 777 analytics

          bye
          EOF
